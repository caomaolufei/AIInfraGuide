<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="915" viewBox="0 0 1200 915" role="img" aria-labelledby="title desc">
<title id="title">6.5 Ray 安排谁来算，GPU 之间再交换计算数据</title>
<desc id="desc">Ray控制进程在启动时安排节点A和B的常驻GPU Worker，数据通过节点内TP和阶段间激活传递。Head不是额外GPU。</desc>
