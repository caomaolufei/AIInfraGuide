<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">6.2 同样得到两个数，拼接和求和为什么不能互换</title>
<desc id="desc">列并行分别算出11和16再拼接；行并行分别算出2,4和9,12，再逐位置相加为11,16。</desc>
<defs>
<marker id="m2563eb" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/>
</marker>
<marker id="m087f67" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#087f67"/>
</marker>
<marker id="mb45309" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b45309"/>
</marker>
<marker id="mb42338" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#b42338"/>
</marker>
<marker id="m7048b8" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L12 6 L0 12 Z" fill="#7048b8"/>
</marker>
</defs>
<rect width="1200" height="880" rx="24" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="65" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">6.2 同样得到两个数，拼接和求和为什么不能互换</text>
<text x="48" y="112" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">同一个函数：X = [2, 3]，W 的两行是 [1, 2]、[3, 4]，Y = [11, 16]</text>
<rect x="48" y="155" width="1104" height="267" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="72" y="198" font-size="28" fill="#2563eb" font-weight="700" text-anchor="start">① 列切：每卡负责不同输出位置</text>
<rect x="80" y="227" width="325" height="153" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="242" y="266" font-size="24" fill="#2563eb" font-weight="700" text-anchor="middle">GPU 0：W 第一列</text>
<text x="242" y="308" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">2×1 + 3×3 = 11</text>
<text x="242" y="354" font-size="25" fill="#172b4d" font-weight="700" text-anchor="middle">局部输出 [11]</text>
<rect x="435" y="227" width="325" height="153" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="597" y="266" font-size="24" fill="#2563eb" font-weight="700" text-anchor="middle">GPU 1：W 第二列</text>
<text x="597" y="308" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">2×2 + 3×4 = 16</text>
<text x="597" y="354" font-size="25" fill="#172b4d" font-weight="700" text-anchor="middle">局部输出 [16]</text>
<path d="M 760 306 H 835" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#m2563eb)"/>
<text x="862" y="282" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">合成方式</text>
<text x="862" y="331" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start">按位置拼接</text>
<text x="862" y="373" font-size="27" fill="#2563eb" font-weight="700" text-anchor="start">[11, 16]</text>
<rect x="48" y="465" width="1104" height="267" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="72" y="508" font-size="28" fill="#087f67" font-weight="700" text-anchor="start">② 行切：每卡贡献同一输出的部分和</text>
<rect x="80" y="537" width="325" height="153" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="242" y="576" font-size="24" fill="#087f67" font-weight="700" text-anchor="middle">GPU 0：X=[2]</text>
<text x="242" y="618" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">[2] × [1, 2]</text>
<text x="242" y="664" font-size="25" fill="#172b4d" font-weight="700" text-anchor="middle">部分和 [2, 4]</text>
<rect x="435" y="537" width="325" height="153" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="597" y="576" font-size="24" fill="#087f67" font-weight="700" text-anchor="middle">GPU 1：X=[3]</text>
<text x="597" y="618" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">[3] × [3, 4]</text>
<text x="597" y="664" font-size="25" fill="#172b4d" font-weight="700" text-anchor="middle">部分和 [9, 12]</text>
<path d="M 760 616 H 835" fill="none" stroke="#087f67" stroke-width="4"  marker-end="url(#m087f67)"/>
<text x="862" y="592" font-size="24" fill="#087f67" font-weight="700" text-anchor="start">合成方式</text>
<text x="862" y="641" font-size="26" fill="#087f67" font-weight="700" text-anchor="start">对应求和</text>
<text x="862" y="683" font-size="27" fill="#087f67" font-weight="700" text-anchor="start">[11, 16]</text>
<text x="48" y="788" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">形状先检查：列切的两个标量拼成两个数；行切的两个二元向量相加仍是两个数。</text>
<text x="48" y="834" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">图中计算使用整数，验证数学关系；真实浮点与通信仍需按实现和误差范围检查。</text>
</g>
</svg>