<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">FP4：数据编码之外，还有分组 Scale</title><desc id="desc">MXFP4每32个E2M1元素共享一个E8M0 Scale，NVFP4每16个E2M1元素共享一个E4M3 Scale并配张量级FP32 Scale。</desc>
