<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
<title id="title">7.2 一条请求，三种不同的信息流</title>
<desc id="desc">客户端经过Router分别请求P和D；P返回缓存元数据，Router转交D；KV大块数据由P到D；D的结果经入口返回客户端。</desc>
<defs>
<marker id="blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563eb"/>
</marker>
<marker id="green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 12 6 L 0 12 Z" fill="#087f67"/>
</marker>
<marker id="orange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 12 6 L 0 12 Z" fill="#b45309"/>
</marker>
<marker id="gray" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 12 6 L 0 12 Z" fill="#64748b"/>
</marker>
</defs>
<rect width="1200" height="910" rx="24" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="65" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">7.2 一条请求，三种不同的信息流</text>
<text x="48" y="112" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">蓝色实线：请求 / 输出　橙色虚线：移交元数据　绿色粗线：KV 数据</text>
<rect x="60" y="160" width="260" height="170" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="190" y="210" font-size="30" fill="#172b4d" font-weight="700" text-anchor="middle">客户端</text>
<text x="190" y="254" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">提交输入与参数</text>
<text x="190" y="293" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">接收生成结果</text>
<rect x="440" y="160" width="320" height="170" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="600" y="205" font-size="29" fill="#172b4d" font-weight="700" text-anchor="middle">Router / 编排入口</text>
<text x="600" y="251" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">选实例、关联请求</text>
<text x="600" y="293" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">传递移交信息</text>
<path d="M 320 212 H 440" fill="none" stroke="#2563eb" stroke-width="4"   marker-end="url(#blue)"/>
<path d="M 440 283 H 320" fill="none" stroke="#2563eb" stroke-width="4"   marker-end="url(#blue)"/>
<rect x="100" y="490" width="420" height="174" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="310" y="536" font-size="28" fill="#172b4d" font-weight="700" text-anchor="middle">P：处理输入，建立 KV</text>
<text x="310" y="581" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">有完整模型计算路径</text>
<text x="310" y="626" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">本机保存待移交的状态</text>
<rect x="680" y="490" width="420" height="174" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="890" y="536" font-size="28" fill="#172b4d" font-weight="700" text-anchor="middle">D：复用 KV，继续生成</text>
<text x="890" y="581" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">也需要完整模型权重</text>
<text x="890" y="626" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">持有接收并增长的状态</text>
<path d="M 480 330 V 420 H 400 V 490" fill="none" stroke="#2563eb" stroke-width="4"   marker-end="url(#blue)"/>
<text x="292" y="404" font-size="24" fill="#2563eb" font-weight="400" text-anchor="start">① 原请求</text>
<path d="M 160 490 V 372 H 440 V 310" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="10 7"  marker-end="url(#orange)"/>
<text x="175" y="355" font-size="24" fill="#b45309" font-weight="400" text-anchor="start">② 缓存在哪里</text>
<path d="M 700 330 V 405 H 880 V 490" fill="none" stroke="#2563eb" stroke-width="4"   marker-end="url(#blue)"/>
<text x="800" y="380" font-size="24" fill="#2563eb" font-weight="400" text-anchor="start">③ 请求 + 定位信息</text>
<path d="M 520 583 H 680" fill="none" stroke="#087f67" stroke-width="8"   marker-end="url(#green)"/>
<text x="600" y="553" font-size="24" fill="#087f67" font-weight="700" text-anchor="middle">④ KV</text>
<path d="M 1100 520 H 1140 V 220 H 760" fill="none" stroke="#2563eb" stroke-width="4"   marker-end="url(#blue)"/>
<text x="895" y="200" font-size="24" fill="#2563eb" font-weight="400" text-anchor="middle">⑤ 输出回到入口</text>
<rect x="48" y="717" width="1104" height="159" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="72" y="758" font-size="28" fill="#172b4d" font-weight="700" text-anchor="start">② 交接清单 ≠ ④ GPU 缓存本体</text>
<text x="72" y="802" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">本图选择 P → D 直接搬运的示意：Router 可以只拿定位信息。</text>
<text x="72" y="845" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">箭头表示逻辑依赖；推送、拉取与分层重叠由具体协议决定。</text>
</g>
</svg>
