" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#181818">剩余 0</text><text x="741" y="271" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="rgb(16,128,110)">W1 取 min(900, 600) = 600</text><g transform="rotate(-2 740 306)"><rect x="690" y="288.15" width="100" height="25.2" fill="#fff"/><text x="698" y="306" font-family="'Hannotate SC', 'Hanzipen SC', 'Kaiti SC', STKaiti, KaiTi, cursive" font-size="21" font-weight="700" fill="#266cda">刚好用完</text></g><rect x="38" y="321" width="836" height="120" rx="10" fill="rgba(24,24,24,.045)" filter="url(#wf)" transform="rotate(-.3 450 376)"/><rect x="32" y="316" width="836" height="120" rx="10" fill="none" stroke="#181818" stroke-width="2.4" filter="url(#wb)"/><text x="50" y="344" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#181818">本步结束后各请求的状态</text><rect x="55" y="364" width="253.33333333333334" height="58" rx="7" fill="rgba(238,148,22,0.3)" filter="url(#wf)"/><rect x="50" y="360" width="253.33333333333334" height="58" rx="7" fill="none" stroke="#181818" stroke-width="2" filter="url(#ws)"/><text x="176.66666666666669" y="384" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#181818">R：已算 2560 → 4000</text><text x="176.66666666666669" y="405" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#2a2a2a">Prefill 完成，下一步转入 Decode</text><rect x="328.33333333333337" y="364" width="253.33333333333334" height="58" rx="7" fill="rgba(22,158,138,0.25)" filter="url(#wf)"/><rect x="323.33333333333337" y="360" width="253.33333333333334" height="58" rx="7" 