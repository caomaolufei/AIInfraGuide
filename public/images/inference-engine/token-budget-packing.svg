)"/><text x="242.64000000000001" y="470" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#555">R 的 Prefill 续块</text><rect x="390.72" y="460" width="16" height="15" rx="3" fill="rgba(22,158,138,0.5)"/><rect x="388.72" y="458" width="16" height="15" rx="3" fill="none" stroke="#181818" stroke-width="2" filter="url(#ws)"/><text x="412.72" y="470" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#555">W1 的首个 Chunk</text><rect x="546.24" y="460" width="16" height="15" rx="3" fill="url(#k)"/><rect x="544.24" y="458" width="16" height="15" rx="3" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="4 3" filter="url(#ws)"/><text x="568.24" y="470" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#555">W2：本步未调度</text><text x="450" y="496" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#969696">示意：Prefill 段按 Token 数等比例绘制；Decode 段只有 8 个 Token，放大显示</text></svg>
