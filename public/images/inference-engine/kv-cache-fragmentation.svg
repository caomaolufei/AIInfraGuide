<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <rect width="900" height="370" rx="12" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">同样 64 个 Token 槽位：连续预留与分页分配的浪费对比</text>
  <g text-anchor="middle" font-weight="600" fill="#0f172a">
    <text x="222" y="82">传统连续分配：按最大长度预留</text>
    <text x="672" y="82">PagedAttention：按块、按需分配</text>
  </g>
  <!-- left: contiguous reservation -->
  <g>
    <rect x="40" y="100" width="112" height="20" fill="#2563eb"/>
    <rect x="155" y="100" width="250" height="20" fill="#fecaca"/>
    <rect x="40" y="123" width="89" height="20" fill="#fecaca"/>
    <rect x="132" y="123" width="181" height="20" fill="#fde68a"/>
    <rect x="316" y="123" width="89" height="20" fill="#2563eb"/>
    <rect x="40" y="146" width="89" height="20" fill="#2563eb"/>
    <rect x="132" y="146" width="273" height="20" fill="#fecaca"/>
    <rect x="40" y="169" width="365" height="20" fill="#fde68a"/>
  </g>
  <path stroke="#ffffff" stroke-width="3" d="M61.5 98V191M84.5 98V191M107.5 98V191M130.5 98V191M153.5 98V191M176.5 98V191M199.5 98V191M222.5 98V191M245.5 98V191M268.5 98V191M291.5 98V191M314.5 98V191M337.5 98V191M360.5 98V191M383.5 98V191"/>
  <g fill="#ffffff" font-size="11" text-anchor="middle">
    <text x="50 73 96 119 142" y="114">AAAAA</text>
    <text x="326 349 372 395" y="137">BBBB</text>
    <text x="50 73 96 119" y="160">BBBB</text>
  </g>
  <!-- right: paged allocation -->
  <g fill="#e2e8f0">
    <rect x="490" y="100" width="365" height="20"/>
    <rect x="490" y="123" width="365" height="20"/>
    <rect x="490" y="146" width="365" height="20"/>
    <rect x="490" y="169" width="365" height="20"/>
  </g>
  <g fill="#2563eb">
    <rect x="490" y="100" width="89" height="20"/>
    <rect x="582" y="100" width="20" height="20"/>
    <rect x="766" y="100" width="89" height="20"/>
    <rect x="674" y="123" width="89" height="20"/>
    <rect x="582" y="146" width="89" height="20"/>
    <rect x="490" y="169" width="43" height="20"/>
  </g>
  <g fill="#fecaca">
    <rect x="605" y="100" width="66" height="20"/>
    <rect x="536" y="169" width="43" height="20"/>
  </g>
  <path stroke="#ffffff" stroke-width="3" d="M511.5 98V191M534.5 98V191M557.5 98V191M580.5 98V191M603.5 98V191M626.5 98V191M649.5 98V191M672.5 98V191M695.5 98V191M718.5 98V191M741.5 98V191M764.5 98V191M787.5 98V191M810.5 98V191M833.5 98V191"/>
  <g fill="none" stroke="#475569" stroke-width="1.2">
    <rect x="488.5" y="98.5" width="92" height="23" rx="3"/><rect x="580.5" y="98.5" width="92" height="23" rx="3"/><rect x="672.5" y="98.5" width="92" height="23" rx="3"/><rect x="764.5" y="98.5" width="92" height="23" rx="3"/>
    <rect x="488.5" y="121.5" width="92" height="23" rx="3"/><rect x="580.5" y="121.5" width="92" height="23" rx="3"/><rect x="672.5" y="121.5" width="92" height="23" rx="3"/><rect x="764.5" y="121.5" width="92" height="23" rx="3"/>
    <rect x="488.5" y="144.5" width="92" height="23" rx="3"/><rect x="580.5" y="144.5" width="92" height="23" rx="3"/><rect x="672.5" y="144.5" width="92" height="23" rx="3"/><rect x="764.5" y="144.5" width="92" height="23" rx="3"/>
    <rect x="488.5" y="167.5" width="92" height="23" rx="3"/><rect x="580.5" y="167.5" width="92" height="23" rx="3"/><rect x="672.5" y="167.5" width="92" height="23" rx="3"/><rect x="764.5" y="167.5" width="92" height="23" rx="3"/>
  </g>
  <g fill="#ffffff" font-size="11" text-anchor="middle">
    <text x="500 523 546 569" y="114">BBBB</text>
    <text x="592" y="114">A</text>
    <text x="776 799 822 845" y="114">CCCC</text>
    <text x="684 707 730 753" y="137">AAAA</text>
    <text x="592 615 638 661" y="160">BBBB</text>
    <text x="500 523" y="183">CC</text>
  </g>
  <!-- outcome for new request C -->
  <rect x="40" y="206" width="365" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 3"/>
  <g text-anchor="middle" font-size="12" fill="#b91c1c">
    <text x="222" y="225">新请求 C 需要连续 20 格：空闲共 24 格，</text>
    <text x="222" y="243">但最大连续空洞只有 16 格，分配失败</text>
  </g>
  <rect x="490" y="206" width="365" height="46" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <g text-anchor="middle" font-size="12" fill="#15803d">
    <text x="672" y="225">新请求 C 按需拿到 2 个空闲块，</text>
    <text x="672" y="243">物理位置不连续也能用</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#0f172a">
    <text x="222" y="282">浪费：内部碎片 15 + 12 格，外部碎片 24 格</text>
    <text x="672" y="282">浪费：只剩 A、C 尾块中的 5 格</text>
  </g>
  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="180" y="304" width="14" height="14" fill="#2563eb"/><text x="200" y="316">已写入的 Token</text>
    <rect x="330" y="304" width="14" height="14" fill="#fecaca"/><text x="350" y="316">已预留或已分配但未用</text>
    <rect x="510" y="304" width="14" height="14" fill="#fde68a"/><text x="530" y="316">零散空洞</text>
    <rect x="630" y="304" width="14" height="14" fill="#e2e8f0"/><text x="650" y="316">空闲槽位</text>
  </g>
  <text x="450" y="352" text-anchor="middle" fill="#64748b" font-size="12">示意：每格为 1 个 Token 槽位；左侧按最大长度 20 预留，右侧 block_size = 4，粗框为 1 个物理块</text>
</svg>
