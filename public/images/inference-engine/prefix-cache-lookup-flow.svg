2" rx="12" fill="#ffffff"/><text x="32" y="34" font-family="'Hannotate SC', 'Hanzipen SC', 'Kaiti SC', STKaiti, KaiTi, cursive" font-size="22" font-weight="700" fill="#266cda" transform="rotate(-1.5 32 34)">Prefix Cache · 逐块查表</text><text x="35" y="73" font-size="25" font-weight="700"><tspan fill="transparent">命中的块跳过 Prefill，</tspan><tspan fill="rgba(58,110,228,0.42)">从第一个未命中块起正常算</tspan></text><text x="32" y="70" font-size="25" font-weight="700"><tspan fill="#181818">命中的块跳过 Prefill，</tspan><tspan fill="#181818">从第一个未命中块起正常算</tspan></text><rect x="32" y="96" width="836" height="236" rx="10" fill="none" stroke="#181818" stroke-width="2.4" filter="url(#wb)"/><rect x="61" y="206" width="152" height="64" rx="7" fill="rgba(24,24,24,.045)" filter="url(#wf)"/><rect x="56" y="202" width="152" height="64" rx="7" fill="none" stroke="#181818" stroke-width="2" filter="url(#ws)"/><text x="132" y="229" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#181818">前缀按块切分</text><text x="132" y="250" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#2a2a2a">只看写满的块</text><path d="M214 234 H244 M236.6 239.1 L244 234 L236.6 228.9" fill="none" stroke="#ee801c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#ws)"/><rect x="255" y="206" width="150" height="64" rx="7" fill="rgba(24,24,24,.045)" filter="url(#wf)"/><rect x="250" y="202" width="150" height="64" rx="7" fill="none" stroke="#181818" stroke-width="2" filter="url(#ws)"/><text x="325" y="229" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#181818">算本块哈希</text><text x="325" y="250" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#2a2a2a">链式：带上父哈希</text><path d="M406 234 H434 M426.6 239.1 L434 234 L426.6 228.9" fill="none" stroke="#ee801c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#ws)"/><path d="M438 234 L500 194 L562 234 L500 274 Z" fill="rgba(238,148,22,.2)" stroke="#181818" stroke-width="2" stroke-linejoin="round" filter="url(#ws)"/><text x="500" y="239" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#181818">查缓存表</text><rect x="357" y="112" width="262" height="56" rx="7" fill="rgba(58,110,228,0.13)" filter="url(#wf)"/><rect x="352" y="108" width="262" height="56" rx="7" fill="none" stroke="#181818" stroke-width="2" filter="url(#ws)"/><text x="483" y="131" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#181818">命中：跳过这块的 Prefill</text><text x="483" y="152" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#2a2a2a">块表指向已有物理块，ref +1</text><path d="M500 190 V170 M505.1 177.4 L500 170 L494.9 177.4" fill="none" stroke="#ee801c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#ws)"/><text x="490" y="184" text-anchor="end" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#555">命中</text><path d="M346 136 C300 136 325 178 325 196 M319.9 188.6 L325 196 L330.1 188.6" fill="none" stroke="#ee801c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#ws)"/><text x="312" y="140" text-anchor="end" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#555">下一块</text><path d="M568 234 H606 M598.6 239.1 L606 234 L598.6 228.9" fill="none" stroke="#ee801c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#ws)"/><text x="588" y="224" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#555">未命中</text><rect x="619" y="206" width="236" height="64" rx="7" fill="rgba(232,86,60,0.14)" filter="url(#wf)"/><rect x="614" y="202" width="236" height="64" rx="7" fill="none" stroke="#181818" stroke-width="2" filter="url(#ws)"/><text x="732" y="229" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#181818">未命中：正常 Prefill</text><text x="732" y="250" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#2a2a2a">从这块起都要算，算完登记新哈希</text><text x="56" y="310" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#2a2a2a">哈希是链式的：某块一旦对不上，后面块的哈希也都跟着变，查找到这里就停</text><g transform="rotate(-2 756.04 338)"><rect x="680" y="320.15" width="152.08000000000004" height="25.2" fill="#fff"/><text x="688" y="338" font-family="'Hannotate SC', 'Hanzipen SC', 'Kaiti SC', STKaiti, KaiTi, cursive" font-size="21" font-weight="700" fill="#266cda">省掉 Prefill</text></g><text x="450" y="360" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#969696">命中部分直接复用已有 KV，只有未命中的 Token 需要 Prefill；最直接的收益是 TTFT 降低</text></svg>
