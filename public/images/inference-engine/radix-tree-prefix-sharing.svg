<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <rect width="900" height="380" rx="12" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">RadixAttention：用基数树组织 KV Cache，按最长前缀匹配复用</text>
  <!-- edges -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.5">
    <path d="M300 190C325 190 325 255 350 255"/>
    <path d="M530 115C555 115 555 67 580 67"/>
    <path d="M530 115C555 115 555 163 580 163"/>
    <path d="M530 255C555 255 555 231 580 231"/>
    <path d="M530 255C555 255 555 279 580 279"/>
  </g>
  <!-- matched path for new request -->
  <g fill="none" stroke="#16a34a" stroke-width="2.5">
    <path d="M110 190H160"/>
    <path d="M300 190C325 190 325 115 350 115"/>
  </g>
  <path d="M530 115H580" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- root -->
  <rect x="40" y="172" width="70" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="75" y="195" text-anchor="middle" fill="#0f172a">根</text>
  <!-- nodes in use -->
  <g fill="#eff6ff" stroke="#2563eb" stroke-width="1.5">
    <rect x="160" y="168" width="140" height="44" rx="6"/>
    <rect x="350" y="93" width="180" height="44" rx="6"/>
    <rect x="350" y="233" width="180" height="44" rx="6"/>
    <rect x="580" y="49" width="180" height="36" rx="6"/>
    <rect x="580" y="145" width="180" height="36" rx="6"/>
    <rect x="580" y="213" width="180" height="36" rx="6"/>
  </g>
  <!-- new branch -->
  <rect x="580" y="97" width="180" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- evictable leaf -->
  <rect x="580" y="261" width="180" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <g text-anchor="middle">
    <g fill="#1d4ed8">
      <text x="230" y="187">系统提示 S</text>
      <text x="440" y="112">用户 Q1 + 回答 A1</text>
      <text x="440" y="252">Few-shot 示例 E</text>
      <text x="670" y="72">追问 Q2</text>
      <text x="670" y="168">另一追问 Q2′</text>
      <text x="670" y="236">问题 X</text>
    </g>
    <g fill="#64748b" font-size="11">
      <text x="230" y="204">ref = 3</text>
      <text x="440" y="129">ref = 2</text>
      <text x="440" y="269">ref = 1</text>
    </g>
    <g fill="#15803d"><text x="670" y="120">新分支 Q3（待 Prefill）</text></g>
    <g fill="#b91c1c"><text x="670" y="284">问题 Y：ref = 0</text></g>
  </g>
  <!-- side notes -->
  <g font-size="12">
    <text x="772" y="111" fill="#15803d">新请求沿绿线匹配</text>
    <text x="772" y="128" fill="#15803d">只需 Prefill Q3</text>
    <text x="772" y="276" fill="#b91c1c">LRU 先淘汰</text>
    <text x="772" y="293" fill="#b91c1c">无人引用的叶子</text>
  </g>
  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="170" y="318" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/><text x="190" y="330">运行中请求正在引用（ref &gt; 0，不可淘汰）</text>
    <rect x="460" y="318" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#16a34a"/><text x="480" y="330">新请求的匹配路径</text>
    <rect x="620" y="318" width="14" height="14" rx="3" fill="#fef2f2" stroke="#dc2626"/><text x="640" y="330">可淘汰叶子</text>
  </g>
  <text x="450" y="362" text-anchor="middle" fill="#64748b" font-size="12">每条边存一段 Token 序列及其 KV；ref 统计经过该节点的运行中请求数。先淘汰叶子，祖先节点的公共前缀就能继续被复用</text>
</svg>
